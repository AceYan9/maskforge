services:

  postgres:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build:
      context: .
    working_dir: /app
    volumes:
      - ./app:/app
    ports:
      - "8808:8808"
    command:
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8808
      --reload
    env_file:
      - .env
    depends_on:
      - postgres
      - minio
      - redis

  worker:
    build:
      context: .
    volumes:
      - ./app:/app
    command:
      celery -A app.worker worker -l info
    depends_on:
      - redis
      - postgres


volumes:
  postgres_data:
  minio_data:
